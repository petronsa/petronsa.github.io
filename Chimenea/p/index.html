<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chimenea · Proyecto compartido</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#9A3B16">
  <link rel="icon" href="../img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="../"><img src="../img/icono.svg" alt=""> <span data-es="Chimenea" data-en="Fireplace Builder">Chimenea</span></a>
    <nav>
      <a href="#" id="imprimir" data-es="Imprimir" data-en="Print">Imprimir</a>
      <a href="../" data-es="Inicio" data-en="Home">Inicio</a>
    </nav>
  </header>

  <main class="contenido">
    <section class="proyecto" id="cabecera" hidden>
      <p class="nota-pequena" id="compartido"></p>
      <h1 id="titulo"></h1>
      <p class="meta" id="cliente" hidden></p>
      <p class="ancho-grande" id="ancho"></p>
      <p class="notas" id="notas" hidden></p>
    </section>
    <div id="visor"></div>
    <section class="error" id="error" hidden>
      <h1 id="error-texto"></h1>
      <a class="boton" href="../" data-es="Ir a la página de la app" data-en="Go to the app page">Ir a la página de la app</a>
    </section>
  </main>

  <footer>
    <a href="../" data-es="Inicio" data-en="Home">Inicio</a> ·
    <a href="../privacidad.html" data-es="Privacidad" data-en="Privacy">Privacidad</a>
  </footer>

  <script type="module">
    import { leerEnlace } from '../js/enlace.js';
    import { montarVisor } from '../js/visor.js';
    import { t, traducirPagina } from '../js/i18n.js';

    traducirPagina();
    document.getElementById('imprimir').addEventListener('click', (e) => { e.preventDefault(); window.print(); });

    // Los datos del proyecto van en el fragmento (#…): nunca se envían al servidor.
    // Las medidas llegan ya calculadas por la app.
    function mostrar() {
      const p = leerEnlace(location.hash);
      const valido = !!p && !p.antiguo;
      const $ = (id) => document.getElementById(id);
      $('cabecera').hidden = !valido;
      $('visor').hidden = !valido;
      $('error').hidden = valido;
      if (!valido) {
        $('error-texto').textContent = p?.antiguo ? t.enlaceAntiguo : t.enlaceInvalido;
        return;
      }
      const titulo = p.nombre || t.sinNombre(p.ancho);
      document.title = `${titulo} · Chimenea`;
      $('compartido').textContent = t.compartidoCon;
      $('titulo').textContent = titulo;
      $('cliente').hidden = !p.cliente;
      $('cliente').textContent = `${t.cliente}: ${p.cliente}`;
      $('ancho').textContent = `${t.ancho}: ${p.ancho} cm`;
      $('notas').hidden = !p.notas;
      $('notas').textContent = p.notas;
      montarVisor($('visor'), { medidas: p.medidas });
    }
    addEventListener('hashchange', mostrar);
    mostrar();
  </script>
</body>
</html>
